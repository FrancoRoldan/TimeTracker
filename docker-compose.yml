services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: timetracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: TimeTracker
      POSTGRES_USER: timetracker_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TimeTracker2024!}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timetracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker_user -d TimeTracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        # Identidad del despliegue, expuesta en GET /info y en la telemetría (§29).
        BUILD_VERSION: ${BUILD_VERSION:-unknown}
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-unknown}
        BUILD_NUMBER: ${BUILD_NUMBER:-unknown}
    container_name: timetracker-backend
    restart: unless-stopped
    # Declara la identidad OTel del contenedor. Promtail la convierte en el label
    # service_name de Loki, que es lo que permite saltar de una traza a sus logs:
    # sin esto, el span dice service.name=timetracker-api y el log decía "backend".
    labels:
      observability.service.name: "timetracker-api"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DbConnString: "Host=postgres;Port=5432;Database=TimeTracker;Username=timetracker_user;Password=${DB_PASSWORD:-TimeTracker2024!}"
      Jwt__Key: ${JWT_KEY:-tu-clave-secreta-muy-larga-de-al-menos-256-bits-para-jwt-token-seguro}
      Jwt__Issuer: ${JWT_ISSUER:-TimeTrackerApi}
      Jwt__Audience: ${JWT_AUDIENCE:-TimeTrackerApp}
      SeedDatabase__Value: ${SEED_DATABASE:-true}
      # Orígenes permitidos por CORS. En Production la API no arranca si está vacío.
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Identidad del despliegue. Los mismos valores se hornean en la imagen como
      # ARG; repetirlos acá permite corregirlos sin reconstruir, que es lo que uno
      # espera al cambiar el .env y hacer `docker compose up -d`.
      Build__Version: ${BUILD_VERSION:-unknown}
      Build__CommitSha: ${BUILD_COMMIT_SHA:-unknown}
      Build__Number: ${BUILD_NUMBER:-unknown}
      # Destino de trazas y métricas.
      #
      # Apunta por defecto al Collector del perfil "observability", para que
      # `docker compose --profile observability up -d` funcione sin necesidad de
      # crear un .env. Levantando sin ese perfil el host no resuelve y el
      # exportador falla en silencio: la aplicación funciona igual y no ensucia
      # los logs, porque esos fallos van al EventSource interno de OpenTelemetry
      # y no a Serilog (§C.4 y §D.5 del plan). Dejarlo vacío lo desactiva del todo.
      Otlp__Endpoint: ${OTLP_ENDPOINT-http://otel-collector:4317}
      # gRPC (4317) por defecto; poner http/protobuf si el collector escucha en 4318.
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTLP_PROTOCOL:-grpc}
      # Cada cuánto exporta métricas el SDK, en milisegundos. El valor por defecto
      # de OpenTelemetry son 60 s: con eso un pico de errores tarda más de un
      # minuto en verse en Grafana y parece que el panel no funciona. Para el
      # volumen de esta aplicación 15 s es barato y hace el tablero utilizable.
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      TZ: ${TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${BACKEND_PORT:-5083}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - timetracker-network
    healthcheck:
      # readiness: verifica la conexión real a PostgreSQL. Antes apuntaba a /health,
      # que devolvía "healthy" aunque la base estuviera caída (hallazgo A7).
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health/ready || exit 1"]
      interval: 30s
      # Un fallo de conexión a PostgreSQL tarda ~15 s en dar timeout: con 10 s el
      # healthcheck se cortaba antes de obtener el diagnóstico real.
      timeout: 25s
      retries: 3
      start_period: 40s

  # Frontend Angular
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: timetracker-frontend
    restart: unless-stopped
    labels:
      observability.service.name: "timetracker-web"

    environment:
      TZ: ${TIMEZONE:-America/Argentina/Buenos_Aires}
      # Config de runtime (docker-entrypoint.sh regenera assets/env.js al arrancar):
      # cambiar estas variables no requiere rebuildear la imagen.
      # URL del API para el frontend (debe ser accesible desde el navegador)
      API_URL: ${API_URL:-http://localhost:5083/api}
      # Acompañan a cada error y Web Vital que reporta el navegador (§29).
      APP_VERSION: ${BUILD_VERSION:-unknown}
      ENV_NAME: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - timetracker-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Plataforma de observabilidad 
  #
  # Va bajo el perfil "observability" para no encarecer el arranque normal:
  #   docker compose up -d                            solo la aplicación
  #   docker compose --profile observability up -d    aplicación + plataforma
  #
  # No hace falta configurar nada: Otlp__Endpoint del backend ya apunta a este
  # Collector por defecto. Grafana queda en http://localhost:${GRAFANA_PORT:-3000}.
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: timetracker-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - tempo
    networks:
      - timetracker-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: timetracker-tempo
    profiles: ["observability"]
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - timetracker-network

  loki:
    image: grafana/loki:3.3.2
    container_name: timetracker-loki
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks:
      - timetracker-network

  promtail:
    image: grafana/promtail:3.3.2
    container_name: timetracker-promtail
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      # Solo lectura del socket: Promtail obtiene los logs por la API de Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - timetracker-network

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: timetracker-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Retención de métricas según §25 del plan.
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - timetracker-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: timetracker-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Entorno de desarrollo: evita la pantalla de login para mirar rápido.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Credenciales para el datasource de PostgreSQL del dashboard de auditoría.
      DB_USER: ${DB_USER:-timetracker_user}
      DB_PASSWORD: ${DB_PASSWORD:-TimeTracker2024!}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - timetracker-network

networks:
  timetracker-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
