# Prometheus — métricas (§30 Fase 4).
# No scrapea la API directamente: la aplicación empuja por OTLP al Collector y
# Prometheus scrapea al Collector (decisión documentada en §D.3 del plan).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
