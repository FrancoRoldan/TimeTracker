# Datasources de Grafana, aprovisionados automáticamente.
#
# La parte importante es la correlación (§21 del plan): desde un log se salta a
# su traza y desde una traza se vuelve a sus logs, siempre por `traceId`.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Desde un span, ver los logs de esa misma traza.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        # Sin este mapeo Grafana no puede construir el selector de stream y el
        # panel de logs sale vacío. Traduce el atributo service.name del span al
        # label service_name de Loki, que Promtail toma de la etiqueta de Docker.
        tags:
          - key: 'service.name'
            value: 'service_name'
      # Desde un span, ver las métricas RED del servicio.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Extrae el traceId del log JSON de Serilog y lo convierte en un enlace
      # directo a la traza en Tempo. Es el salto síntoma -> causa de §32.
      # OJO con el marcador del valor capturado. Grafana interpola $VAR en los
      # archivos de aprovisionamiento, así que un solo $ hace que ${__value.raw}
      # se guarde como cadena vacía.
      #
      # Para los enlaces a Tempo eso es lo CORRECTO: con url vacío, Grafana usa el
      # valor capturado por el regex como identificador de traza, y los enlaces
      # aparecen. Escaparlo como $${__value.raw} guardaba el literal y los enlaces
      # dejaban de renderizarse. Se deja el $ simple a propósito.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]{32})"'
          url: '${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'Ver traza'
        # Los eventos de telemetría del frontend traen el traceId del navegador
        # en un campo propio: también debe enlazar.
        - name: BrowserTraceID
          matcherRegex: '"BrowserTraceId":"([a-f0-9]{32})"'
          url: '${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'Ver traza del navegador'

        # El SessionId no enlaza a una traza sino de vuelta a Loki, filtrando por
        # esa sesión: es el paso 2 del runbook de soporte, "qué venía haciendo el
        # usuario". Acá el destino es una consulta de LogQL y no un identificador
        # suelto, así que sí hace falta el literal escapado con $$.
        - name: SessionId
          matcherRegex: '"SessionId":"([^"]+)"'
          url: '{service_name="timetracker-api"} |= "$${__value.raw}"'
          datasourceUid: loki
          urlDisplayLabel: 'Ver recorrido de la sesión'

  # La auditoría vive en PostgreSQL, no en Loki: es un registro de negocio con
  # requisitos de retención propios (§25), no telemetría operacional.
  # Se consulta en modo solo lectura desde el Dashboard 7 de §26.
  - name: PostgreSQL
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    # Grafana solo interpola $VAR en el aprovisionamiento: la sintaxis de bash
    # ${VAR:-valor} se pasa literal y la conexión falla con
    # "no PostgreSQL user name specified in startup packet".
    user: $DB_USER
    secureJsonData:
      password: $DB_PASSWORD
    jsonData:
      database: TimeTracker
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
